<!DOCTYPE html>
<html>
<head>
  <title>Generate Extension Icons</title>
</head>
<body>
  <h2>Icon Generator</h2>
  <p>Open this file in a browser and it will generate the required icons</p>
  
  <canvas id="canvas16" width="16" height="16"></canvas>
  <canvas id="canvas48" width="48" height="48"></canvas>
  <canvas id="canvas128" width="128" height="128"></canvas>
  
  <script>
    function createIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      // Gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#f09433');
      gradient.addColorStop(0.25, '#e6683c');
      gradient.addColorStop(0.5, '#dc2743');
      gradient.addColorStop(0.75, '#cc2366');
      gradient.addColorStop(1, '#bc1888');
      
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // White chart icon
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.6}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('📊', size / 2, size / 2);
      
      // Download link
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon${size}.png`;
        a.textContent = `Download icon${size}.png`;
        a.style.display = 'block';
        a.style.margin = '10px';
        document.body.appendChild(a);
      });
    }
    
    createIcon('canvas16', 16);
    createIcon('canvas48', 48);
    createIcon('canvas128', 128);
  </script>
</body>
</html>
